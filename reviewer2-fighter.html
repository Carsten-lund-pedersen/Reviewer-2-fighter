  #bK{right:calc(var(--vw)*2);bottom:calc(var(--vh)*4)}

const cv=document.getElementById('c');
let ctx=cv.getContext('2d');
ctx.imageSmoothingQuality='high';
const W=960,H=540,GY=470;
const DPR=Math.min(2,Math.max(1,window.devicePixelRatio||1));
const BGQ=Math.min(2,Math.max(DPR,1.5));   /* backgrounds are pre-rendered sharper, so the camera zoom stays crisp */
cv.width=W*DPR;cv.height=H*DPR;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- input ---------- */
const keys={},pressed={},hist=[];
const KONAMI='arrowup,arrowup,arrowdown,arrowdown,arrowleft,arrowright,arrowleft,arrowright,b,a';
function checkEggs(){
  const tail=n=>hist.slice(-n).join(',');
  if(tail(2)==='c,c'||tail(6)==='c,o,f,f,e,e'||tail(10)===KONAMI){hist.length=0;toggleCoffee();}   /* press C twice, type 'coffee', or Konami */
  if(tail(7)==='c,a,r,s,t,e,n')carstenEgg();
  if(tail(2)==='g,g'||tail(4)==='g,a,n,g')gangEgg();   /* press G twice */
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(!keys[k])pressed[k]=true;
  keys[k]=true;initAudio();
  if(k==='m'&&!e.repeat)toggleMute();
  if(!e.repeat){hist.push(k);if(hist.length>12)hist.shift();checkEggs();}
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

/* ---------- touch controls ---------- */
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(TOUCH){
  document.getElementById('pad').style.display='block';
  document.body.classList.add('touch');
}
document.querySelectorAll('.b').forEach(b=>{
  const k=b.dataset.k;
  const down=e=>{e.preventDefault();if(!keys[k])pressed[k]=true;keys[k]=true;b.classList.add('on');initAudio();};
  const up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',down);
  ['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,up));
});
let tapC=0,tapL=0,tapT=0,lastTap=0;
cv.addEventListener('pointerdown',e=>{
  initAudio();
  const r=cv.getBoundingClientRect();
  const rotated=TOUCH&&matchMedia('(orientation:portrait)').matches;
  const mx=rotated?(e.clientY-r.top)/r.height*W:(e.clientX-r.left)/r.width*W;
  const my=rotated?(r.right-e.clientX)/r.width*H:(e.clientY-r.top)/r.height*H;
  if(TOUCH&&!document.fullscreenElement){
    try{document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}
    try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}
  }
  if(mx>=908&&mx<=952&&my>=88&&my<=130&&(state!=='final'||replayDone)){toggleMute();return;}   /* speaker icon */
  if(state==='fight'&&mx>=442&&mx<=518&&my>=18&&my<=72){   /* secret: tap the timer 3x mid-fight */
    const nw=performance.now();if(nw-lastTap>1800)tapT=0;lastTap=nw;if(++tapT>=3){tapT=0;gangEgg();}return;
  }
  if(state==='title'&&mx>=10&&mx<=96&&my>=458&&my<=526){toggleCoffee();return;}   /* coffee cup button */
  if(state==='title'){
    const now=performance.now();if(now-lastTap>1800){tapC=0;tapL=0;}lastTap=now;
    if(my>=124&&my<=178&&mx>=230&&mx<=730){if(++tapC>=3){tapC=0;carstenEgg();}return;}   /* secret: tap the credit 3x */
    if(my>=50&&my<=122){if(++tapL>=3){tapL=0;toggleCoffee();}return;}                       /* secret: tap the logo 3x */
  }
  if(state==='select'){
    if(mx>=760&&my>=506){resetReq();return;}
    for(let i=0;i<OPP.length;i++){
      const x=CARD.x0+i*(CARD.w+CARD.g);
      if(mx>=x&&mx<=x+CARD.w&&my>=CARD.y&&my<=CARD.y+CARD.h){if(i===sel)pressed['enter']=true;else sel=i;}
    }
  }else pressed['enter']=true;
});

/* ---------- audio: sound effects + chiptune music (with mute) ---------- */
const MUTE_KEY='reviewer2fighter.mute';
let muted=false;try{muted=localStorage.getItem(MUTE_KEY)==='1';}catch(e){}
let AC,MG,SFXG,MUSG,NB;
function initAudio(){
  if(!AC){
    try{
      AC=new(window.AudioContext||window.webkitAudioContext)();
      MG=AC.createGain();MG.gain.value=muted?0:1;MG.connect(AC.destination);
      SFXG=AC.createGain();SFXG.gain.value=1;SFXG.connect(MG);
      MUSG=AC.createGain();MUSG.gain.value=.55;MUSG.connect(MG);
      NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
      const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      setInterval(musicTick,30);
    }catch(e){AC=null;}
  }
  if(AC&&AC.state==='suspended')AC.resume();
}
function toggleMute(){
  muted=!muted;
  try{localStorage.setItem(MUTE_KEY,muted?'1':'0');}catch(e){}
  if(MG)MG.gain.setTargetAtTime(muted?0:1,AC.currentTime,.03);
  if(!muted)beep(660,.08,'square',.05,200);
}
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume();});
function beep(f,d=.08,type='square',v=.05,slide=0){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
  g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g);g.connect(SFXG);o.start();o.stop(AC.currentTime+d);
}
function tone(freq,t,dur,type,vol,dest,slideTo){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02);
}
function noiseBurst(dur,type,freq,vol,dest,t0){
  if(!AC)return;
  const t=t0||AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;f.type=type;f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest||SFXG);s.start(t,Math.random()*.5);s.stop(t+dur+.02);
}
/* sound effects */
function hitSnd(heavy){
  if(!AC)return;const t=AC.currentTime;
  noiseBurst(heavy?.16:.1,'bandpass',heavy?800:1500,heavy?.4:.3);
  tone(heavy?75:115,t,.16,'sine',heavy?.5:.35,SFXG,35);
}
function blockSnd(){
  if(!AC)return;const t=AC.currentTime;
  noiseBurst(.06,'highpass',3000,.22);tone(900,t,.09,'square',.05,SFXG,600);
}
function thud(){
  if(!AC)return;const t=AC.currentTime;
  tone(62,t,.12,'sine',.22,SFXG,36);noiseBurst(.07,'lowpass',320,.12);
}
function cheer(){
  if(!AC)return;
  const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;s.loop=true;f.type='bandpass';f.frequency.value=1000;f.Q.value=.7;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.2,t+.25);g.gain.exponentialRampToValueAtTime(.0001,t+1.5);
  s.connect(f);f.connect(g);g.connect(SFXG);s.start(t);s.stop(t+1.6);
}
function jingle(kind){
  if(!AC)return;
  const seqs={win:[[72,.12],[76,.12],[79,.12],[84,.4]],
    all:[[72,.12],[76,.12],[79,.12],[84,.2],[79,.12],[84,.12],[88,.2],[91,.7]],
    lose:[[67,.25],[64,.25],[60,.25],[55,.7]]};
  let t=AC.currentTime+.05;
  for(const [m,d] of seqs[kind]){tone(mid2f(m),t,d*1.6,kind==='lose'?'sawtooth':'square',.1,SFXG);t+=d;}
}
function finalJingle(){jingle(pw>rw?(beaten.every(Boolean)?'all':'win'):'lose');}
/* chiptune music: a tiny step sequencer. Each track = tempo, key, chord progression, bass, lead, drums */
const SC={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10]};
const mid2f=m=>440*Math.pow(2,(m-69)/12);
const N=null;
const TRACKS={
  menu:{bpm:128,root:57,mode:'min',prog:[0,5,2,6],lw:'square',lv:.07,len:1.6,arp:true,aw:'square',
    bass:[0,N,0,N,4,N,0,N,0,N,0,N,4,N,0,N],
    leadA:[7,N,9,N,11,N,9,7,4,N,7,N,9,N,7,N],leadB:[11,N,12,N,11,N,9,7,9,N,7,N,4,N,2,N],
    drums:'k.h.s.h.k.h.s.h.'},
  f0:{bpm:120,root:60,mode:'maj',prog:[0,4,5,3],lw:'triangle',lv:.13,len:1.8,arp:true,aw:'square',
    bass:[0,N,4,N,0,N,4,N,0,N,4,N,0,N,4,N],
    leadA:[4,N,7,N,9,7,4,N,5,N,9,N,7,5,4,N],leadB:[7,N,9,N,11,9,7,N,5,N,4,N,2,N,0,N],
    drums:'k...h.s.k...h.s.'},
  f1:{bpm:150,root:52,mode:'min',prog:[0,5,6,4],lw:'square',lv:.08,len:1.2,arp:false,
    bass:[0,0,N,0,0,0,N,0,0,0,N,0,0,0,N,4],
    leadA:[7,7,N,9,7,N,5,N,7,7,N,10,9,N,7,N],leadB:[9,9,N,11,9,N,7,N,5,5,N,7,4,N,2,N],
    drums:'k.h.s.hkk.h.s.hh'},
  f2:{bpm:96,root:59,mode:'min',prog:[0,5,3,6],lw:'sine',lv:.16,len:4,arp:true,aw:'sine',
    bass:[0,N,N,N,N,N,N,N,4,N,N,N,N,N,N,N],
    leadA:[7,N,N,N,9,N,N,N,8,N,N,N,6,N,N,N],leadB:[11,N,N,10,N,N,9,N,N,N,7,N,N,N,N,N],
    drums:'k.......h.h.s...'},
  f3:{bpm:108,root:55,mode:'min',prog:[0,3,0,4],lw:'sawtooth',lv:.06,len:2.4,arp:false,
    bass:[0,N,0,N,0,N,0,N,0,N,0,N,0,N,0,N],
    leadA:[7,N,N,7,N,N,9,N,10,N,N,N,9,N,7,N],leadB:[10,N,N,10,N,N,12,N,11,N,N,N,9,N,7,N],
    drums:'k...s...k.k.s...'}
};
let mTrack=null,mStep=0,mNext=0,mWant=null;
function setMusic(n){
  if(n===mWant)return;
  mWant=n;mTrack=n?TRACKS[n]:null;mStep=0;mNext=0;
  if(AC){const t=AC.currentTime;MUSG.gain.cancelScheduledValues(t);MUSG.gain.setValueAtTime(0,t);if(n)MUSG.gain.linearRampToValueAtTime(.55,t+.4);}
}
function playStep(tr,st,t,sd){
  const sc=SC[tr.mode],deg=d=>tr.root+sc[((d%7)+7)%7]+12*Math.floor(d/7);
  const bar=(st>>4)%tr.prog.length,s=st&15,ch=tr.prog[bar];
  const b=tr.bass[s];
  if(b!=null)tone(mid2f(deg(ch+b)-12),t,sd*1.8,'triangle',.22,MUSG);
  const d=(bar<2?tr.leadA:tr.leadB)[s];
  if(d!=null)tone(mid2f(deg(d+ch)),t,sd*tr.len,tr.lw,tr.lv,MUSG);
  if(tr.arp&&(s&1)===0)tone(mid2f(deg(ch+[0,2,4,2][(s>>1)&3])+12),t,sd*1.4,tr.aw,.04,MUSG);
  const c=tr.drums[s];
  if(c==='k')tone(150,t,.13,'sine',.5,MUSG,40);
  else if(c==='s'){noiseBurst(.12,'highpass',1800,.3,MUSG,t);tone(200,t,.06,'triangle',.15,MUSG,120);}
  else if(c==='h')noiseBurst(.04,'highpass',7000,.12,MUSG,t);
}
function musicTick(){
  if(!AC||!mTrack||AC.state!=='running')return;
  const tr=mTrack,sd=60/tr.bpm/4;
  if(!mNext||mNext<AC.currentTime-.1)mNext=AC.currentTime+.08;
  while(mNext<AC.currentTime+.16){playStep(tr,mStep,mNext,sd);mNext+=sd;mStep++;}
}

/* ---------- fighters ---------- */
class Fighter{

function physics(f){

function stepWorld(control){
  const foes=(B.on?[R,B]:[R]).sort((a,b)=>Math.abs(a.x-P.x)-Math.abs(b.x-P.x));
  if(control){playerControl(P,foes[0]);aiControl(R,P);if(B.on)aiControl(B,P);}
  physics(P);physics(R);if(B.on)physics(B);
  const pairs=B.on?[[P,R],[P,B],[R,B]]:[[P,R]];
  for(const [a,b] of pairs){
    const dx=b.x-a.x;
    if(!a.ko&&!b.ko&&Math.abs(dx)<46&&Math.abs(a.y-b.y)<60){
      const push=(46-Math.abs(dx))/2,sg=Math.sign(dx)||1;a.x-=sg*push;b.x+=sg*push;
    }

  if(control){

  for(const p of projs){

      if(!d.ko&&Math.abs(p.x-d.x)<d.w+(p.kind==='c'?Math.max(50,p.hw*.6):20)&&p.y>d.y-150&&p.y<d.y-20){
        p.life=0;
        damage(p.own,d,p.kind==='c'?{dmg:8,kb:5,stun:14}:{dmg:14,kb:9,stun:22},p.x,true);
        const o=p.own;

      }

  }

      b.life=0;stats.rebutted++;spark(b.x,b.y,'#7f7',16,7);floatText(b.x,b.y-30,'REBUTTED!','#7f7',20);beep(500,.1,'square',.05,300);
    }

function updateFx(){

    if(q.k==='h'){if(--q.life<=0)parts.splice(i,1);continue;}
    q.x+=q.vx;q.y+=q.vy;q.vy+=q.k==='p'?.25:q.k==='f'?.06:q.k==='d'?-.02:.3;q.vx*=.98;if(q.k==='p'||q.k==='f')q.rot+=q.vr;
    if(--q.life<=0)parts.splice(i,1);
  }

let keepInput=false;
const padEl=document.getElementById('pad');let padShown=true;const rebEl=document.getElementById('bS2');
function update(){
  if(slowT>0&&state==='roundEnd'){slowT--;slowAcc+=slowT>30?.45:.7;if(slowAcc<1)return;slowAcc-=1;}else if(state!=='roundEnd')slowT=0;
  stateT++;
  setMusic(state==='title'||state==='select'?'menu':(state==='intro'||state==='fight')?'f'+OPP.indexOf(R.cfg):null);

  if(state==='intro'||state==='fight'||state==='roundEnd'){const dist=Math.abs(R.x-P.x);camZ+=(1+clamp((560-dist)/560,0,1)*.1-camZ)*.06;camX+=((P.x+R.x)/2-camX)*.08;}

  if(wantPad!==padShown){padShown=wantPad;padEl.style.visibility=wantPad?'visible':'hidden';}

  if(state==='title'){updateFx();if(pressed['enter']||pressed[' ']){state='select';stateT=0;}return;}
  if(state==='select'){

      return;
    }

  }

    }

function atkPhase(f,A){
  const t=f.at;
  if(A.a>=999)return{ext:Math.sin(Math.PI*Math.min(1,t/A.dur)),wd:0};   /* comment / rebuttal: simple swing */
  if(t<A.a)return{ext:0,wd:Math.sin(t/A.a*Math.PI/2)};
  if(t<=A.b){const q=Math.min(1,(t-A.a)/Math.max(2,(A.b-A.a)*.7)),e=1-Math.pow(1-q,3);return{ext:e,wd:1-e};}
  const q=Math.min(1,(t-A.b)/Math.max(1,A.dur-A.b));return{ext:1-q*q*(3-2*q),wd:0};
}

/* mirror image of a fighter on the glossy floor */

  ctx.translate(0,GY*2);ctx.scale(1,-1);

function drawProj(p){

    ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=14;ctx.shadowOffsetY=5;
    ctx.fillStyle=p.rare?'#fff3b0':(p.cfg||R.cfg).bub;ctx.strokeStyle=p.rare?'#c98a00':'#222';ctx.lineWidth=4;rr(-wd/2,-h/2,wd,h,16);ctx.fill();

    ctx.fillStyle=p.rare?'#7a3d00':(p.cfg||R.cfg).txt;lines.forEach((l,i)=>ctx.fillText(l,0,-h/2+28+i*32));
    ctx.restore();

    for(let i=1;i<6;i++){ctx.fillStyle='rgba(120,255,140,'+(.25-i*.04)+')';ctx.beginPath();ctx.arc(-Math.sign(p.vx)*i*12,0,12-i,0,7);ctx.fill();}

    ctx.beginPath();ctx.moveTo(-26,-17);ctx.lineTo(0,3);ctx.lineTo(26,-17);ctx.stroke();
    txt('REBUTTAL',0,9,9,'#1c7c35');
    ctx.restore();
  }
}

function credit(str,x,y,size){
  ctx.save();

  const w=ctx.measureText(str).width,ol=Math.max(4,size/5);

  ctx.strokeStyle='#5a1200';ctx.fillStyle='#5a1200';ctx.lineWidth=ol;

}

  drawCrowd();
  if(B.on)drawReflection(B);drawReflection(R);drawReflection(P);
  {const ff2=ctx.createLinearGradient(0,GY,0,H);ff2.addColorStop(0,'rgba(0,0,0,0)');ff2.addColorStop(1,'rgba(0,0,0,.32)');ctx.fillStyle=ff2;ctx.fillRect(-60,GY,W+120,H-GY);}
  if(B.on)drawFighter(B);drawFighter(R);drawFighter(P);
  projs.forEach(drawProj);
  drawParts();
  ctx.restore();
  ctx.restore();   /* end of the shaken, camera-zoomed world */
  if(state==='fight'&&P.hp>0&&P.hp/P.max<.25){const pu=.12+.1*Math.sin(T*.18),lv=ctx.createRadialGradient(W/2,H/2,240,W/2,H/2,640);lv.addColorStop(0,'rgba(200,0,0,0)');lv.addColorStop(1,'rgba(200,0,0,'+pu+')');ctx.fillStyle=lv;ctx.fillRect(0,0,W,H);}   /* low-health warning */
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash+')';ctx.fillRect(0,0,W,H);flash=Math.max(0,flash-.03);}
  if(slowT>0&&state==='roundEnd'){const vg=ctx.createRadialGradient(W/2,H/2,160,W/2,H/2,640);vg.addColorStop(0,'rgba(120,0,0,0)');vg.addColorStop(1,'rgba(120,0,0,'+(.5*Math.min(1,slowT/20))+')');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);}

  if(state==='title'){
    const og=ctx.createRadialGradient(W/2,H/2,120,W/2,H/2,620);og.addColorStop(0,'rgba(10,6,20,.55)');og.addColorStop(1,'rgba(0,0,0,.88)');
    ctx.fillStyle=og;ctx.fillRect(0,0,W,H);
    gtxt('PEER REVIEW FIGHTER',W/2,95+Math.sin(stateT*.05)*3,70,'#fff3a0','#ff8a00','#5a1500');
    ctx.fillStyle='rgba(24,8,56,.94)';rr(W/2-250,124,500,54,10);ctx.fill();
    ctx.strokeStyle='#ffd23f';ctx.lineWidth=3;rr(W/2-250,124,500,54,10);ctx.stroke();
    txt('CREATED BY',W/2,138,13,'#cfd8ff','center','#000');
    credit('CARSTEN LUND PEDERSEN',W/2,161,28);
    txt('DR. HOPEFUL  vs  THE REVIEWERS',W/2,205,28,'#ff6b6b','center','#000');
    ctx.font='16px "Segoe UI",Arial';ctx.textAlign='center';ctx.fillStyle='#fff';
    (TOUCH?['Use the on-screen buttons: move, JUMP, BLOCK (hold), PUNCH and KICK.',
     'REBUTTAL throws a Rebuttal Letter once your meter is at least half full.',
     'Your rebuttal destroys incoming stupid comments. Jump over them or block them.',
     'Pass ALL 3 reviewers AND the Editor to get ACCEPTED.']
    :['A / D  or  Arrows : move          W / Up / Space : jump          S / Down : block (hold)',
     'J : punch          K : kick          L : Rebuttal Letter (needs meter - fills as you fight)',
     'Your rebuttal destroys incoming stupid comments. Jump over them or block them.',
     'Pass ALL 3 reviewers AND the Editor to get ACCEPTED.']).forEach((l,i)=>ctx.fillText(l,W/2,258+i*28));
    if(Math.floor(stateT/30)%2===0)txt(TOUCH?'TAP TO SUBMIT':'PRESS ENTER TO SUBMIT',W/2,420,34,'#fff','center','#000');
    txt('No reviewers were harmed in the making of this game.',W/2,486,16,'#fff','center','#000');
    txt('Made for fun - and perhaps a little stress management. Not to be taken seriously.',W/2,507,14,'#ffd98a','center','#000');
    {const cx=44,cy=486,bob=Math.sin(stateT*.08)*2;   /* coffee cup button: click or tap it */
      ctx.fillStyle=coffee?'#ffb45a':'#f4efe2';ctx.strokeStyle='#000';ctx.lineWidth=2.5;rr(cx-16,cy-12+bob,30,26,5);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.arc(cx+16,cy+1+bob,8,-1.4,1.4);ctx.stroke();
      ctx.fillStyle='#5a3418';ctx.fillRect(cx-13,cy-9+bob,24,6);
      ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;for(let i=0;i<2;i++){ctx.beginPath();ctx.moveTo(cx-6+i*9,cy-17+bob);ctx.quadraticCurveTo(cx-10+i*9,cy-24+bob,cx-6+i*9,cy-30+bob);ctx.stroke();}
      txt(coffee?'COFFEE: ON':(TOUCH?'TAP FOR COFFEE':'CLICK or C C'),cx,516,11,coffee?'#ffb45a':'#cfd8ff','center','#000');}
    txt(TOUCH?'Tap the speaker icon to mute':'M = mute / unmute sound',W-16,524,12,'#9aa4c0','right','#000');
    return;
  }
  if(state==='select'){drawSelect();return;}
  hud();
  if(state==='intro'){
    if(stateT<50){txt('ROUND '+round,W/2,230,80,'#ffe066','center','#7a1f00');txt(ARENAS[sel].name,W/2,290,22,'#fff','center','#000');}
    else txt('FIGHT!',W/2,230,100*(1+Math.max(0,(60-stateT)/40)),'#ff5a3c','center','#000');
  }
  if(state==='roundEnd'){
    if(stateT<70)txt('K.O.!',W/2,220,120,'#ff3b3b','center','#000');
    else{
      txt(P.ko?'REVISIONS REQUIRED':'ROUND WON',W/2,200,60,P.ko?'#ff6b6b':'#8dff9c','center','#000');
      txt(roundMsg,W/2,260,22,'#fff','center','#000');
    }
  }
  if(state==='final'){
    if(!replayDone){drawReplay();return;}
    ctx.fillStyle='rgba(4,2,12,.93)';ctx.fillRect(0,0,W,H);
    const win=pw>rw,all=beaten.every(Boolean),n=beaten.filter(Boolean).length;
    const col=win?(all?'#3ddc6a':'#ffd23f'):'#e0262f';
    const kk=Math.min(1,stateT/16),ee=1-Math.pow(1-kk,3);
    ctx.save();ctx.translate(W/2,150);ctx.rotate(-.12);ctx.globalAlpha=Math.min(1,stateT/5);const sc=3-2*ee;ctx.scale(sc,sc);
    ctx.strokeStyle=col;ctx.lineWidth=10;rr(-270,-60,540,120,12);ctx.stroke();
    txt(win?(all?'ACCEPTED':'REVIEW PASSED'):'REJECTED',0,0,win&&!all?60:100,col);
    ctx.restore();
    ctx.globalAlpha=clamp((stateT-14)/10,0,1);
    txt(win?R.cfg.win:R.cfg.lose,W/2,248,24,'#fff','center','#000');
    if(win&&all)txt('All 3 reviewers and the Editor are satisfied. Paper ACCEPTED!',W/2,282,20,'#8dff9c','center','#000');
    else if(win)txt('Reviews passed: '+n+' / 4  -  not accepted yet. Face the next reviewer!',W/2,282,20,'#ffd23f','center','#000');
    else txt('Reviews passed so far: '+n+' / 4',W/2,282,20,'#ffe066','center','#000');
    ctx.globalAlpha=1;
    [['HITS LANDED',stats.hits],['BEST COMBO',stats.combo],['ATTACKS BLOCKED',stats.blocked],['COMMENTS REBUTTED',stats.rebutted]].forEach((it,i)=>{
      const x=79+i*204,ca=clamp((stateT-22-i*8)/10,0,1),y=306+(1-ca)*10;
      ctx.globalAlpha=ca;
      ctx.fillStyle='rgba(255,255,255,.08)';rr(x,y,190,58,10);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;rr(x,y,190,58,10);ctx.stroke();
      txt(String(Math.round(it[1]*clamp((stateT-30-i*8)/30,0,1))),x+95,y+22,28,'#ffe066','center','#000');
      txt(it[0],x+95,y+46,11,'#cfd8ff','center','#000');
    });
    ctx.globalAlpha=1;
    txt('Final score  '+pw+' : '+rw,W/2,392,16,'#cfd8ff','center','#000');
    if(stateT>60&&Math.floor(stateT/30)%2===0)txt(TOUCH?'TAP TO CONTINUE':'PRESS ENTER TO CONTINUE',W/2,430,30,'#fff','center','#000');
    credits(478);
  }
}

/* ---------- loop (fixed 60 Hz) ---------- */
let acc=0,prev=performance.now();
function frame(now){
  const dt=Math.min(100,now-prev);acc+=dt;prev=now;
  if(!lite&&!document.hidden){fAvg+=(dt-fAvg)*.05;if(fAvg>24){if(++slowN>150)lite=true;}else slowN=0;}   /* sustained < ~42 fps -> drop the floor reflections */
  while(acc>=1000/60){update();if(keepInput)keepInput=false;else for(const k in pressed)delete pressed[k];acc-=1000/60;}
  draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
